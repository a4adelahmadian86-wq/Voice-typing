services:
  - type: web
    name: farast-voice
    runtime: python
    plan: free
    region: frankfurt
    branch: free-groq-edge-tts
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FARAST_VOICE_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_ASR_MODEL
        value: whisper-large-v3
      - key: FARAST_EDGE_TTS_VOICE
        value: fa-IR-FaridNeural
      - key: FARAST_VOICE_ID
        value: farast-fa-male-v1
      - key: FARAST_MAX_AUDIO_BYTES
        value: "15728640"
      - key: FARAST_MAX_TEXT_CHARS
        value: "1200"
