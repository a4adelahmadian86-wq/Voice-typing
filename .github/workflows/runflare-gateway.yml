name: runflare-ai-gateway-tests

on:
  push:
    branches: [main, runflare-ai-gateway]
    paths:
      - "runflare-gateway/**"
      - ".github/workflows/runflare-gateway.yml"
  pull_request:
    paths:
      - "runflare-gateway/**"
      - ".github/workflows/runflare-gateway.yml"

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runflare-gateway/requirements-dev.txt
      - name: Install gateway test dependencies
        run: python -m pip install -r runflare-gateway/requirements-dev.txt
      - name: Compile gateway
        run: python -m compileall -q runflare-gateway
      - name: Run gateway contract tests
        working-directory: runflare-gateway
        run: pytest -q
